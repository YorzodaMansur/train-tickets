<!DOCTYPE html>
<html lang="tg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ҷадвали қатораҳо — Роҳи Оҳани Тоҷикистон</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
        }

        .panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
        }

        .train-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🚆 Роҳи Оҳани Тоҷикистон</a>
            <a class="btn btn-outline-info btn-sm" href="my-tickets.html">Чиптаҳои ман</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold">Ҷадвали қатораҳо</h1>
                <p class="text-secondary">Маълумот дар бораи хатсайрҳои дастрас</p>
            </div>
            <a href="index.html" class="btn btn-outline-info">Ҷустуҷӯи нав</a>
        </div>

        <section class="panel p-4">
            <label for="trip-live-search" class="form-label">Ҷустуҷӯи қатора</label>
            <input type="search" id="trip-live-search" class="form-control" maxlength="80"
                placeholder="Шаҳр ё рақами қатораро нависед">

            <div id="trip-search-results" class="mt-3" aria-live="polite">
                <p class="text-secondary mb-0">
                    Барои дидани натиҷаҳо номи шаҳр ё рақами қатораро ворид кунед.
                </p>
            </div>
        </section>
    </main>

    <script type="module" src="../assets/js/app.js"></script>
</body>

</html>
